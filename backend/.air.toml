[build]
  cmd = "templ generate && go build -o ./tmp/main ./cmd/server"
  bin = "./tmp/main"
  full_bin = "./tmp/main"
  include_ext = ["go", "templ", "css", "html"]
  exclude_dir = ["tmp", "node_modules", "dist"]
  delay = 500
  stop_on_error = false

[log]
  time = false

[misc]
  clean_on_exit = true
