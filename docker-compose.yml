services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: physiq
      POSTGRES_PASSWORD: physiq
      POSTGRES_DB: physiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        migrate -path=/migrations -database "postgres://${POSTGRES_USER:-physiq}:${POSTGRES_PASSWORD:-physiq}@db:5432/${POSTGRES_DB:-physiq}?sslmode=disable" up
    environment:
      POSTGRES_USER: physiq
      POSTGRES_PASSWORD: physiq
      POSTGRES_DB: physiq
    volumes:
      - ./backend/migrations:/migrations
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DB_HOST: db
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/tmp
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
